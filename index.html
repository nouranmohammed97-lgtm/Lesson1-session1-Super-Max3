<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9.1 Reading the Signs</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--y:#C99700;--yt:rgba(201,151,0,.18);--head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--body:'Barlow',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;overflow:hidden;font-family:var(--body)}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{width:1280px;flex:none;transform-origin:center center;display:flex;flex-direction:column;color:#000;font-size:19px;line-height:1.4}
#stage{width:1280px;height:720px;background:#fff;border:3px solid #000;display:flex;flex-direction:column}
:focus-visible{outline:3px solid #000;outline-offset:2px}
.hd{background:#000;color:#fff;display:flex;align-items:stretch;height:64px;flex:none}
.hd .n{background:var(--y);color:#000;font:700 46px/1 var(--head);padding:8px 16px 0}
.hd .t{font:700 26px/64px var(--head);padding:0 18px;letter-spacing:.02em}
.hd .s{margin-left:auto;font:600 20px/64px var(--head);padding:0 20px;letter-spacing:.04em;color:var(--y)}
.bd{flex:1;padding:16px 36px 8px;overflow:auto;min-height:0}
h2{font:700 34px/1.05 var(--head);margin:0 0 6px}
.task{border-left:8px solid var(--y);padding:2px 0 2px 14px;margin:0 0 10px;font-weight:500;font-size:19px}
.ft{height:60px;flex:none;border-top:4px solid #000;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:relative}
.ft .bar{position:absolute;left:0;top:-4px;height:4px;background:var(--y)}
.ft .pos{font:600 18px var(--head);letter-spacing:.05em}
.btn{background:#000;color:#fff;border:2px solid #000;padding:8px 20px;font:700 20px/1 var(--head);letter-spacing:.04em;cursor:pointer;min-height:40px}
.btn.y{background:var(--y);color:#000}.btn.o{background:#fff;color:#000}
.btn[disabled]{opacity:.3;cursor:default}
.plate{background:var(--y);border:2px solid #000;padding:12px 16px}
.card{border:2px solid #000;padding:12px 16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 36px}
.signs{display:grid;grid-template-columns:repeat(9,1fr);gap:12px}
.sg{display:flex;flex-direction:column;gap:6px}
.tile{position:relative;background:#fff;border:2px solid #000;padding:0;aspect-ratio:1;cursor:pointer;width:100%}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.tile .L{position:absolute;left:-2px;top:-2px;background:#000;color:#fff;font:700 18px/1 var(--head);padding:5px 9px}
.tile.tick{background:var(--yt)}
.tile .tk{position:absolute;right:0;top:0;background:var(--y);border:2px solid #000;font:700 20px/1 var(--head);padding:3px 8px}
.tile .rs{position:absolute;left:0;right:0;bottom:0;text-align:center;font:700 15px/1 var(--head);padding:5px;background:#000;color:#fff}
.tile .rs.no{background:var(--y);color:#000}
.cap{font:600 17px/1.15 var(--head);text-align:center;background:var(--y);border:2px solid #000;padding:5px 4px;min-height:48px;display:flex;align-items:center;justify-content:center}
.words{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px}
.word{border:2px solid #000;padding:10px 14px;font:700 26px/1.1 var(--head);display:flex;justify-content:space-between;align-items:center;background:#fff;cursor:pointer;text-align:left;min-height:56px}
.word small{font:600 13px var(--head);background:#000;color:#fff;padding:3px 6px}
.box{background:var(--yt);border:2px solid #000;padding:6px 16px;font-weight:500;margin-bottom:6px}
.ex{list-style:none;margin:0;padding:0}
.ex li{display:flex;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.18);flex-wrap:wrap}
.ex .no{flex:0 0 26px;font:700 22px var(--head)}
.ex .q{flex:1 1 240px}
select{font:600 22px/1.2 var(--body);color:#000;background:#fff;border:2px solid #000;padding:6px 8px;min-height:46px;max-width:100%}
select option{color:#000;background:#fff;font-size:20px}
.ex select{flex:0 1 290px}
.ex.cols li{padding:2px 0}.ex.cols .q{font-size:17px;line-height:1.25;flex:1 1 150px}.ex.cols select{flex:0 1 215px;font-size:19px;min-height:40px}
.ex .res{flex:0 0 32px;height:32px;display:grid;place-items:center;font:700 20px var(--head)}
li.good .res{background:#000;color:var(--y)}li.bad .res{background:var(--y);border:2px solid #000}
li.bad select{border-style:dashed}
.opts{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;padding-left:36px}
.opts label{border:2px solid #000;padding:5px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;min-height:38px}
.opts input{accent-color:#000;width:17px;height:17px}
.opts label:has(input:checked){background:var(--y)}
.ex.inl .opts{flex-basis:auto;padding-left:0;margin-left:auto}.ex.inl .q{flex:0 0 330px}
.acts{display:flex;gap:10px;align-items:center;margin-top:10px}
.score{font:700 22px var(--head)}
mark{background:var(--y);padding:0 3px;color:#000}
.script{border:2px solid #000;columns:2;column-gap:0}
.script .sp{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:8px 14px;border-bottom:1px solid rgba(0,0,0,.18);break-inside:avoid;font-size:17px;line-height:1.4}
.script .who{font:700 19px var(--head)}
.script .hl{background:var(--y);padding:0 3px;font-weight:600}
.script .hl sup{font:700 12px var(--head);background:#000;color:#fff;padding:2px 4px;margin-left:3px}
.seg{cursor:pointer;border-bottom:4px solid transparent;padding:0 1px}
.seg:hover{background:var(--yt)}
.seg.u1{border-bottom-color:#000}.seg.u2{border-bottom-color:var(--y)}.seg.u3{border-bottom:5px double #000}
.seg sup{font:700 12px var(--head);background:#000;color:#fff;padding:2px 4px;margin-left:3px}
.seg.bad{background:var(--yt);outline:2px dashed #000}.seg.miss{outline:2px dashed #000}
.seg.good sup{background:var(--y);color:#000}
.legend{display:flex;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.legend span{border:2px solid #000;padding:3px 12px;font-weight:600;font-size:18px}
.gb{border:2px solid #000}.gb .h{background:#000;color:#fff;font:700 22px var(--head);padding:8px 14px}
.gb .r{display:grid;grid-template-columns:150px 1fr;border-top:1px solid #000}
.gb .r>div{padding:8px 14px}.gb .r>div:first-child{background:var(--yt);font:700 22px var(--head)}
.gb .r>div:last-child{font-size:21px;line-height:2.2}
.gb i{display:block;font-size:17px;line-height:1.4}
.model{background:#fff;border:2px solid #000;border-radius:24px;padding:10px 18px;display:inline-block;font-style:italic;margin-top:10px}
canvas{border:2px solid #000;width:100%;height:100%;display:block;touch-action:none;background:#fff;cursor:crosshair}
.split{display:flex;gap:30px;align-items:center;height:calc(100% - 20px)}
.split .tx{flex:1}.split .ic{flex:0 0 240px}.split .ic svg{width:100%;height:auto}
/* flip cards */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:12px;height:calc(100% - 80px)}
.fl{perspective:1200px;background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.fl.big{width:900px;height:410px;margin:14px auto 0}.fl.big .f,.fl.big .b{padding:24px;gap:34px}.fl.big .f svg{width:360px}.fl.big .f span{font-size:34px;line-height:1.25}.fl.big .b{gap:14px}.fl.big .b b{font-size:84px}.fl.big .b em{font-size:30px;padding:3px 16px}.fl .b .say{font-size:24px;padding:12px 30px;margin-top:8px}
.w{cursor:pointer;display:inline-block;padding:0 3px;margin:1px 0;border-radius:14px}.w:hover{background:var(--yt)}.w.circ{box-shadow:0 0 0 3px #000;background:var(--yt)}.w.good{background:var(--y)}.w.bad{box-shadow:0 0 0 3px #000;border-radius:3px;background:#fff;text-decoration:line-through}
.fl .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fl.on .in{transform:rotateY(180deg)}
.fl .f,.fl .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid #000;background:#fff;padding:8px 10px;display:flex;align-items:center;gap:10px}
.fl .f svg{width:104px;flex:none;border:2px solid #000;background:#fff}
.fl .f span{font-size:16.5px;line-height:1.25;font-weight:500}
.fl .b{transform:rotateY(180deg);background:var(--y);flex-direction:column;justify-content:center;text-align:center;gap:2px}
.fl .b b{font:700 32px/1.05 var(--head)}
.fl .b em{font:600 20px var(--head);background:#000;color:#fff;padding:2px 10px;font-style:normal;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.fl .in{transition:none}}
/* notes */
#notes{width:1280px;border:3px solid #000;border-top:0;display:flex;flex-direction:column;height:210px}
#notes .nh{background:var(--y);display:flex;justify-content:space-between;align-items:center;padding:4px 16px;font:700 20px var(--head);letter-spacing:.05em;flex:none}
#notes .nh button{background:#000;color:#fff;border:0;font:700 16px var(--head);padding:5px 12px;cursor:pointer}
#nb{padding:8px 18px;overflow:auto;font-size:17px;line-height:1.45}
#nb b{background:var(--yt);padding:0 3px}
#nb p{margin:0 0 5px}
</style></head>
<body>
<div id="app">
 <div id="stage">
  <div class="hd"><div class="n">9.1</div><div class="t">READING THE SIGNS</div><div class="s" id="sec"></div></div>
  <div class="bd" id="bd"></div>
  <div class="ft"><div class="bar" id="bar"></div><button class="btn o" id="bk">Back</button><div class="pos" id="pos"></div><button class="btn y" id="nx">Next</button></div>
 </div>
 <div id="notes"><div class="nh"><span>TEACHER SCRIPT</span><button id="tg">Hide script</button></div><div id="nb"></div></div>
</div>

function selEx(root,{items,opts,cols}){
  const ol=el(`<ul class="ex ${cols?'cols':''}"></ul>`);
  items.forEach((it,i)=>{const o=it.opts||opts;
    const li=el(`<li><span class="no">${i+1}</span><span class="q">${it.q}</span><select aria-label="Answer ${i+1}"><option value="">Choose…</option>${o.map(x=>`<option>${x}</option>`).join('')}</select><span class="res"></span></li>`);
    li._a=it.a;ol.append(li)});
  const sc=el('<span class="score"></span>'),c=el('<button class="btn">Check</button>'),s=el('<button class="btn o">Show answers</button>'),r=el('<button class="btn o">Try again</button>');
  const mark=li=>{const ok=li._a.includes($('select',li).value);li.className=ok?'good':'bad';$('.res',li).textContent=ok?'✓':'✗';return ok};
  c.onclick=()=>{let n=0;$$('li',ol).forEach(li=>{if(!$('select',li).value){li.className='';$('.res',li).textContent='';return}mark(li)&&n++});sc.textContent=n+' / '+items.length};
  s.onclick=()=>{$$('li',ol).forEach(li=>{const x=$('select',li);if(!li._a.includes(x.value))x.value=li._a[0];mark(li)});sc.textContent=items.length+' / '+items.length};
  r.onclick=()=>{$$('li',ol).forEach(li=>{li.className='';$('select',li).value='';$('.res',li).textContent=''});sc.textContent=''};
  const a=el('<div class="acts"></div>');a.append(c,s,r,sc);root.append(ol,a);
}
function multiEx(root,items){
  const ol=el('<ul class="ex inl"></ul>');
  items.forEach((it,i)=>{const li=el(`<li><span class="no">${i+1}</span><span class="q">${it.q}</span><span class="res"></span><div class="opts">${it.o.map((x,j)=>`<label><input type="checkbox" value="${j}"> ${x}</label>`).join('')}</div></li>`);li._a=it.a;ol.append(li)});
  const sc=el('<span class="score"></span>'),c=el('<button class="btn">Check</button>'),s=el('<button class="btn o">Show answers</button>');
  c.onclick=()=>{let n=0;$$('li',ol).forEach(li=>{const v=$$('input',li).filter(i=>i.checked).map(i=>+i.value).join();const ok=v===li._a.join();li.className=ok?'good':'bad';$('.res',li).textContent=ok?'✓':'✗';ok&&n++});sc.textContent=n+' / '+items.length};
  s.onclick=()=>{$$('li',ol).forEach(li=>$$('input',li).forEach(i=>i.checked=li._a.includes(+i.value)));c.onclick()};
  const a=el('<div class="acts"></div>');a.append(c,s,sc);root.append(ol,a);
}
